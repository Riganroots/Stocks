name: Refresh NEPSE market data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "data/universe.json"
      - "data/fundamentals.json"
      - ".github/workflows/update-market-data.yml"
  schedule:
    - cron: "30 10 * * 0-4"

permissions:
  contents: write

concurrency:
  group: nepse-market-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stocks
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public NEPSE OHLC source
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/socrateai-official/nepse-open-data.git /tmp/nepse-open-data
          git -C /tmp/nepse-open-data sparse-checkout set ohlc_unadjusted_stock

      - name: Build history and technical indicators
        run: |
          python scripts/update_market_data.py --source-dir /tmp/nepse-open-data/ohlc_unadjusted_stock
          python scripts/calculate_technicals.py
          python scripts/calculate_scores.py
          python scripts/update_regulatory_announcements.py
          python scripts/build_static_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_history.json data/technicals.json data/scores.json data/generated_market.js data/fundamentals.js data/announcements.json data/announcements.js
          if git diff --cached --quiet; then
            echo "No market-data changes"
          else
            git commit -m "data: refresh NEPSE history, swing metrics and announcements"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
